name: Build IPA for LiveContainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Scan2WA.xcodeproj \
            -scheme Scan2WA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scan2WA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scan2WA.xcarchive/Products/Applications/Scan2WA.app build/Payload/
          cd build
          zip -r Scan2WA.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scan2WA-ipa
          path: build/Scan2WA.ipa
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.9.2 build/Scan2WA.ipa \
            --title "Scan2WA v1.9.2 (Added Confirmé Status with Blue Theme, Plus Livré, Reporté, Annulé)" \
            --notes "### Scan2WA v1.9.2

          Ready-to-sideload unsigned IPA for **LiveContainer** / AltStore / SideStore on iPhone 15 Pro Max.

          **What's New in v1.9.2:**
          - **Added 'Confirmé' Delivery Status**:
            - **🔵 Confirmé** (Order / Call Confirmed): Royal Blue theme (\`#1E88E5\`) with verified seal icon (\`checkmark.seal.fill\`).
            - Alongside **🟢 Livré** (Delivered), **🟠 Reporté** (Postponed), and **🔴 Annulé** (Cancelled).
            - Now choose between all 4 statuses directly when photographing or editing packages.
            - Filter by 'Confirmé' tab in the Packages inventory with live counter badge.
            - 1-tap quick status switcher directly on each package card.
          - **High Contrast & Accessible Badges**:
            - Dynamic accessible contrast on all buttons and status badges.
          - **All v1.9.1 Hardening Preserved**:
            - 100% Main-Actor thread safety on OCR detections.
            - Upright photo capture with \`UIImage.fixOrientation()\`.
            - Fast 120Hz scrolling with in-memory \`NSCache\`.
            - Battery-saving camera auto-pause in sub-screens and background." \
            || true
