name: Build IPA for LiveContainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Scan2WA.xcodeproj \
            -scheme Scan2WA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scan2WA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scan2WA.xcarchive/Products/Applications/Scan2WA.app build/Payload/
          cd build
          zip -r Scan2WA.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scan2WA-ipa
          path: build/Scan2WA.ipa
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.6.0 build/Scan2WA.ipa \
            --title "Scan2WA v1.6.0 (Fixed Sideways Photo, Stable Aiming & Strict Real Numbers)" \
            --notes "### Scan2WA v1.6.0
          
          Ready-to-sideload unsigned IPA for **LiveContainer** / AltStore / SideStore on iPhone 15 Pro Max.
          
          **What's Fixed in v1.6.0:**
          - **Fixed Sideways/Rotated Photo**: Corrected portrait orientation check so photos are always perfectly upright, never turned 90 degrees sideways.
          - **Eliminated Premature Freezing**: Requires 0.9s of steady, stable aiming over the numbers (and 8 consecutive verified frames) before auto-freezing. No more freezing in mid-air while moving the phone!
          - **Strict Real Phone Numbers (No Guessing)**: Validates real Moroccan mobile/landline numbers (05, 06, 07, +212) and international numbers (+). Rejects random digits, timestamps, and barcodes.
          - **100% Silent Instant Freeze**: Freezes frame directly from video buffer with zero shutter sound.
          - **Prominent 'Scan Again' Button**: Large green button in center and top bar.
          - **WhatsApp Business & Personal Routing**: Direct deep linking without confirmation popups." \
            || true
