name: Build IPA for LiveContainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Scan2WA.xcodeproj \
            -scheme Scan2WA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scan2WA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scan2WA.xcarchive/Products/Applications/Scan2WA.app build/Payload/
          cd build
          zip -r Scan2WA.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scan2WA-ipa
          path: build/Scan2WA.ipa
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.7.0 build/Scan2WA.ipa \
            --title "Scan2WA v1.7.0 (Fixed Exact Green Highlights On Numbers)" \
            --notes "### Scan2WA v1.7.0
          
          Ready-to-sideload unsigned IPA for **LiveContainer** / AltStore / SideStore on iPhone 15 Pro Max.
          
          **What's Fixed in v1.7.0:**
          - **Fixed Green Highlight & Underline Placement**: Replaced legacy metadata conversion that swapped coordinates into vertical strips with direct Cartesian coordinate transformation (\`convertVisionRectToScreen\`). The green highlight box and underline now align horizontally and exactly over the phone number digits.
          - **Sub-string Bounding Box Accuracy**: Uses Vision's \`VNRecognizedText.boundingBox(for:)\` to isolate the exact character range of the phone number, ignoring extraneous surrounding text.
          - **Seamless Camera Viewport**: Keeps preview layer mounted underneath frozen photo so unfreezing with 'Scan Again' is instantaneous with zero screen flicker.
          - **Retains All v1.6.0 Fixes**: 100% upright photo orientation, 0.9s steady aiming filter (no premature freeze), silent zero-sound capture, and direct WhatsApp Business deep linking." \
            || true
