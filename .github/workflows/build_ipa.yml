name: Build IPA for LiveContainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Scan2WA.xcodeproj \
            -scheme Scan2WA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scan2WA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scan2WA.xcarchive/Products/Applications/Scan2WA.app build/Payload/
          cd build
          zip -r Scan2WA.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scan2WA-ipa
          path: build/Scan2WA.ipa
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.4.0 build/Scan2WA.ipa \
            --title "Scan2WA v1.4.0 (True Photo Freeze & Multi-Number Fix)" \
            --notes "### Scan2WA v1.4.0
          
          Ready-to-sideload unsigned IPA for **LiveContainer** / AltStore / SideStore on iPhone 15 Pro Max.
          
          **What's New in v1.4.0:**
          - **True Photo Freeze**: Visual freeze immediately shows the captured still photo rather than a moving camera feed.
          - **Multi-Number Capture**: 0.65s debounce window plus high-resolution secondary OCR pass on the frozen photo to catch both Expéditeur and Destinataire numbers.
          - **Manual Shutter Button**: Circle shutter button to capture and freeze whenever you want.
          - **Direct WhatsApp Business routing**: Using 'whatsapp-smb://' to enter chat directly without confirmation popups.
          - **Personal WhatsApp routing**: Direct 'whatsapp-consumer://' deep link.
          - **Dual SIM Calling**: In-app guidance and 1-tap deep link to iOS Cellular settings for default SIM line." \
            || true
