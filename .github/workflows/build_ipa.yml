name: Build IPA for LiveContainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Scan2WA.xcodeproj \
            -scheme Scan2WA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scan2WA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scan2WA.xcarchive/Products/Applications/Scan2WA.app build/Payload/
          cp Scan2WA/App/Info.plist build/Payload/Scan2WA.app/Info.plist
          cp Scan2WA/Assets.xcassets/AppIcon.appiconset/AppIcon-60@2x.png build/Payload/Scan2WA.app/AppIcon60x60@2x.png || true
          cp Scan2WA/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png build/Payload/Scan2WA.app/AppIcon60x60@3x.png || true
          python3 -c "from PIL import Image; Image.open('Scan2WA/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png').convert('RGB').resize((512, 512), Image.Resampling.LANCZOS).save('build/Payload/Scan2WA.app/iTunesArtwork', format='JPEG', quality=85)" || true
          python3 scripts/sanitize_plist.py build/Payload/Scan2WA.app/Info.plist
          cd build
          zip -r Scan2WA.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scan2WA-ipa
          path: build/Scan2WA.ipa
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('Scan2WA/App/Info.plist', 'rb'))['CFBundleShortVersionString'])")
          TAG="v${VERSION}"
          echo "Releasing for tag: $TAG"
          gh release create "$TAG" build/Scan2WA.ipa \
            --title "Scan2WA $TAG" \
            --notes "Ready-to-sideload unsigned IPA for **LiveContainer**, **SideStore**, **AltStore**, and **iLoader** on iOS 16+." \
            || gh release upload "$TAG" build/Scan2WA.ipa --clobber || true

      - name: Update SideStore Source
        run: |
          python3 scripts/update_apps_json.py build/Scan2WA.ipa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update SideStore apps.json source [skip ci]" && git push origin main)
