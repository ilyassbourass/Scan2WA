name: Build IPA for LiveContainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Scan2WA.xcodeproj \
            -scheme Scan2WA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scan2WA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scan2WA.xcarchive/Products/Applications/Scan2WA.app build/Payload/
          cd build
          zip -r Scan2WA.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scan2WA-ipa
          path: build/Scan2WA.ipa
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.8.0 build/Scan2WA.ipa \
            --title "Scan2WA v1.8.0 (Package Photos, Last-2-Digits Search & Notes)" \
            --notes "### Scan2WA v1.8.0
          
          Ready-to-sideload unsigned IPA for **LiveContainer** / AltStore / SideStore on iPhone 15 Pro Max.
          
          **What's New in v1.8.0:**
          - **Save Package & Take Photo**: Directly from the phone number action sheet, tap 'Save Package & Take Photo' to photograph the parcel box.
          - **Photo Review & Retake**: Instant preview with 'Save Package' and 'Try Again (Retake)' buttons.
          - **Delivery Notes & Location Links**: Add notes (apartment, COD amount) and map links (with 1-tap clipboard paste).
          - **Fast Last-2-Digits Search**: Search bar instantly filters packages by the last two digits of the customer's phone number (e.g. typing '73' filters all packages ending in 73).
          - **Packages Inventory Screen**: Dedicated 'Packages' view with photo thumbnails, full-screen zoom, prominent '#XX' badges, and 1-tap WA Business, Call, and Copy buttons.
          - **100% Local & Offline**: All data and images persist securely in app storage.
          - **Retains All Scanner Features**: Horizontal green highlights, 0.9s steady aiming filter, silent instant freeze, and direct WhatsApp Business deep links." \
            || true
