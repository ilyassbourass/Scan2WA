name: Build IPA for LiveContainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Scan2WA.xcodeproj \
            -scheme Scan2WA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scan2WA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scan2WA.xcarchive/Products/Applications/Scan2WA.app build/Payload/
          cd build
          zip -r Scan2WA.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scan2WA-ipa
          path: build/Scan2WA.ipa
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.5.0 build/Scan2WA.ipa \
            --title "Scan2WA v1.5.0 (Silent Freeze, Instant Detection & Prominent Scan Again)" \
            --notes "### Scan2WA v1.5.0
          
          Ready-to-sideload unsigned IPA for **LiveContainer** / AltStore / SideStore on iPhone 15 Pro Max.
          
          **What's New in v1.5.0:**
          - **100% Silent Instant Freeze**: Freezes frame directly from video buffer with zero shutter sound (no audio/song).
          - **Direct Freeze on Numbers Detected**: Immediate freeze upon detecting multiple numbers, or 0.35s one-shot timer for single numbers (no waiting to move away).
          - **Prominent 'Scan Again' Button**: Large, glowing green button right in the center and top bar to easily scan the next label.
          - **Multi-Number Capture**: Catches both Expéditeur and Destinataire with secondary high-res OCR pass on the frozen photo.
          - **WhatsApp Business Direct Chat**: Using 'whatsapp-smb://' to enter chat directly without popup dialogs.
          - **Personal WhatsApp Routing**: Using 'whatsapp-consumer://'.
          - **Dual SIM Calling Setup**: 1-tap shortcut to iOS Cellular Settings." \
            || true
