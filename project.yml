name: Scan2WA
options:
  bundleIdPrefix: com.ilyassbourass
  deploymentTarget:
    iOS: "17.0"
targets:
  Scan2WA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Scan2WA
    info:
      path: Scan2WA/App/Info.plist
      properties:
        CFBundleDisplayName: "Scan2WA"
        CFBundleShortVersionString: "1.9.2"
        CFBundleVersion: "192"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Camera access is needed to scan and recognize phone numbers in real-time."
        LSApplicationQueriesSchemes:
          - whatsapp-smb
          - whatsappsmb
          - whatsapp-business
          - whatsapp
          - whatsapp-consumer
    settings:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      PRODUCT_BUNDLE_IDENTIFIER: com.ilyassbourass.Scan2WA
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.9"
