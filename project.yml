name: Scan2WA
options:
  bundleIdPrefix: com.ilyassbourass
  deploymentTarget:
    iOS: "17.0"
targets:
  Scan2WA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Scan2WA
    info:
      path: Scan2WA/App/Info.plist
      properties:
        CFBundleDisplayName: "Scan2WA"
        CFBundleShortVersionString: "1.10.0"
        CFBundleVersion: "1100"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Camera access is needed to scan and recognize phone numbers in real-time."
        NSPhotoLibraryUsageDescription: "Photo library access is required to select package photos from your camera roll."
        LSApplicationQueriesSchemes:
          - whatsapp-smb
          - whatsappsmb
          - whatsapp-business
          - whatsapp
          - whatsapp-consumer
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.ilyassbourass.Scan2WA
            CFBundleURLSchemes:
              - scan2wa
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.ilyassbourass.Scan2WA.search
            UIApplicationShortcutItemTitle: "Search Packages"
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeSearch
          - UIApplicationShortcutItemType: com.ilyassbourass.Scan2WA.addPackage
            UIApplicationShortcutItemTitle: "Add Package"
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
    settings:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      PRODUCT_BUNDLE_IDENTIFIER: com.ilyassbourass.Scan2WA
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.9"
