<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d0a" />
      <stop offset="50%" stop-color="#081813" />
      <stop offset="100%" stop-color="#030b08" />
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040d0a" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#040d0a" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f261e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#081813" stop-opacity="0.65" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="25" flood-color="#10b981" flood-opacity="0.15" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#34d399" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#emeraldGlow)" />
  <rect width="1200" height="420" fill="url(#cyanGlow)" />

  <!-- Subtle Viewfinder Grid -->
  <g opacity="0.07" stroke="#34d399" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Top Status / Tag Bar -->
  <g transform="translate(60, 48)">
    <rect width="210" height="28" rx="14" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#34d399" />
    <text x="28" y="19" class="mono" font-size="11" font-weight="600" fill="#34d399" letter-spacing="0.5">APPLE VISION OCR • LIVE</text>

    <!-- Version Badge -->
    <rect x="220" y="0" width="105" height="28" rx="14" fill="#06b6d4" fill-opacity="0.12" stroke="#22d3ee" stroke-width="1" />
    <text x="234" y="19" class="mono" font-size="11" font-weight="600" fill="#22d3ee">v1.11.4 IPA</text>
  </g>

  <!-- Main Hero Title & Subtitle -->
  <g transform="translate(60, 130)">
    <text class="sans" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Scan2WA <tspan fill="#34d399">📱⚡</tspan>
    </text>
    <text y="42" class="sans" font-size="20" font-weight="500" fill="#94a3b8">
      Real-Time iOS Camera OCR • 1-Tap WhatsApp Direct Chat
    </text>
    <text y="74" class="sans" font-size="14.5" font-weight="400" fill="#64748b">
      Point camera at any phone number on screens, documents, or packages.
    </text>
    <text y="96" class="sans" font-size="14.5" font-weight="500" fill="#10b981">
      Zero contacts saved. Zero typing. Instant WhatsApp Business launch.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 140)">
      <!-- Pill 1 -->
      <g>
        <rect width="138" height="34" rx="8" fill="#111c18" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <text x="12" y="22" class="sans" font-size="12" font-weight="600" fill="#a7f3d0">📸 Triple Camera</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(148, 0)">
        <rect width="144" height="34" rx="8" fill="#111c18" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <text x="12" y="22" class="sans" font-size="12" font-weight="600" fill="#a7f3d0">🔍 Macro Sensor</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(302, 0)">
        <rect width="136" height="34" rx="8" fill="#111c18" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <text x="12" y="22" class="sans" font-size="12" font-weight="600" fill="#a7f3d0">❄️ Freeze Frame</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(448, 0)">
        <rect width="148" height="34" rx="8" fill="#111c18" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
        <text x="12" y="22" class="sans" font-size="12" font-weight="600" fill="#67e8f9">📲 LiveContainer</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic: High-Tech Viewfinder Mockup Card -->
  <g transform="translate(680, 50)" filter="url(#cardShadow)">
    <!-- Glassmorphic Card Container -->
    <rect width="460" height="315" rx="18" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

    <!-- Card Header / Camera HUD -->
    <rect width="460" height="42" rx="18" fill="#051410" fill-opacity="0.7" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="76" y="26" class="mono" font-size="12" font-weight="600" fill="#6ee7b7">CAMERA VIEWPORT • 4K 60FPS</text>
    <text x="360" y="26" class="mono" font-size="11" font-weight="600" fill="#34d399">0.5x 1x 2x 5x</text>

    <!-- Simulated Document / Scanned Label -->
    <g transform="translate(32, 65)">
      <!-- Document Box -->
      <rect width="396" height="150" rx="10" fill="#020b08" stroke="#052e16" stroke-width="1" />
      
      <!-- Label Details -->
      <text x="20" y="32" class="mono" font-size="11" fill="#475569">EXPRESS SHIPMENT #49281-MA</text>
      <text x="20" y="58" class="sans" font-size="13" font-weight="600" fill="#94a3b8">Customer Contact Number:</text>
      
      <!-- Scanned Number with Vision Bounding Box -->
      <g transform="translate(20, 72)">
        <rect width="210" height="38" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" filter="url(#badgeGlow)" />
        <!-- Corner brackets for HUD targeting -->
        <path d="M -3 6 L -3 -3 L 6 -3" fill="none" stroke="#34d399" stroke-width="2.5" />
        <path d="M 213 6 L 213 -3 L 204 -3" fill="none" stroke="#34d399" stroke-width="2.5" />
        <path d="M -3 32 L -3 41 L 6 41" fill="none" stroke="#34d399" stroke-width="2.5" />
        <path d="M 213 32 L 213 41 L 204 41" fill="none" stroke="#34d399" stroke-width="2.5" />
        
        <text x="14" y="25" class="mono" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">
          +212 661 234 567
        </text>
      </g>

      <!-- Instant 1-Tap Action Button Badge -->
      <g transform="translate(245, 72)">
        <rect width="135" height="38" rx="8" fill="#10b981" />
        <text x="16" y="24" class="sans" font-size="13" font-weight="700" fill="#042f2e">
          🟢 Chat on WA
        </text>
      </g>

      <text x="20" y="132" class="mono" font-size="10.5" fill="#10b981">
        ✓ Confidence: 99.8% • Latency: 12ms (Apple Neural Engine)
      </text>
    </g>

    <!-- Bottom Status Footer -->
    <g transform="translate(32, 235)">
      <rect width="396" height="52" rx="10" fill="#051c14" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />
      <circle cx="20" cy="26" r="6" fill="#10b981" />
      <text x="36" y="24" class="sans" font-size="12" font-weight="600" fill="#f1f5f9">
        Direct Universal Link Ready
      </text>
      <text x="36" y="40" class="mono" font-size="10" fill="#34d399">
        wa.me/212661234567 → WhatsApp Business auto-launch
      </text>
      
      <!-- Haptic Icon -->
      <rect x="330" y="14" width="54" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="340" y="30" class="mono" font-size="10" font-weight="600" fill="#a7f3d0">HAPTIC</text>
    </g>
  </g>
</svg>
